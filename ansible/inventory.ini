# Example inventory for manual Ansible runs over SSH.
# Replace the public IP/DNS name, SSH user and private-key path.
# GitHub Actions creates a temporary inventory automatically.

[webservers]
inventory-ec2 ansible_host=REPLACE_WITH_EC2_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/inventory-ec2.pem

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_become_user=root
