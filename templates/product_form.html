{% extends "base.html" %}
{% block title %}{{ page_title }} · StockWise{% endblock %}
{% block content %}
<div class="mb-4"><a class="text-decoration-none" href="{{ url_for('dashboard') }}">← Back to dashboard</a><div class="eyebrow mt-3 mb-1">PRODUCT CATALOG</div><h1 class="h2 fw-bold">{{ page_title }}</h1><p class="text-secondary">Enter the product details and current stock level.</p></div>
<div class="card border-0 shadow-sm form-card"><div class="card-body p-4">
<form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="name">Product name *</label><input class="form-control" id="name" name="name" required maxlength="120" value="{{ product.name if product else request.form.get('name','') }}"></div>
    <div class="col-md-6"><label class="form-label" for="sku">SKU (unique code) *</label><input class="form-control" id="sku" name="sku" required maxlength="40" value="{{ product.sku if product else request.form.get('sku','') }}" placeholder="e.g. KB-001"></div>
    <div class="col-md-6"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" maxlength="80" value="{{ product.category if product else request.form.get('category','') }}" placeholder="e.g. Accessories"></div>
    <div class="col-md-6"><label class="form-label" for="price">Unit price (₹) *</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else request.form.get('price','') }}"></div>
    <div class="col-md-6"><label class="form-label" for="quantity">Quantity in stock *</label><input class="form-control" id="quantity" name="quantity" type="number" min="0" step="1" required value="{{ product.quantity if product else request.form.get('quantity','0') }}"></div>
    <div class="col-md-6"><label class="form-label" for="reorder_level">Low-stock threshold</label><input class="form-control" id="reorder_level" name="reorder_level" type="number" min="0" step="1" value="{{ product.reorder_level if product else request.form.get('reorder_level','5') }}"><div class="form-text">The product is flagged when quantity is at or below this number.</div></div>
  </div>
  <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save product</button><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
