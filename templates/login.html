{% extends "base.html" %}
{% block title %}Login · StockWise{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card shadow-sm auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="eyebrow mb-2">INVENTORY CONTROL</div>
      <h1 class="h3 fw-bold mb-2">Welcome back</h1>
      <p class="text-secondary mb-4">Sign in to manage your products and stock.</p>
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required maxlength="40" autocomplete="username"></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
      </form>
      <p class="text-secondary small mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
