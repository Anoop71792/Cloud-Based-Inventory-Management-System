name: CD

# Push to main: CI -> build/push immutable image -> Ansible deployment over SSH.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: inventory-management-system
  RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
  CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
jobs:
  ci:
    name: Run CI before release
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push image to ECR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required AWS settings
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCOUNT_ID" || {
            echo "Repository variable AWS_ACCOUNT_ID is missing"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Repository secret AWS_ROLE_ARN is missing"
            exit 1
          }

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID" || {
            echo "OIDC role resolved to unexpected AWS account"
            exit 1
          }

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute immutable image tag
        id: meta
        run: |
          echo "image_tag=mysql-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 through SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ vars.EC2_SSH_USER }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          RDS_ENDPOINT: ${{ env.RDS_ENDPOINT }}
          CERTBOT_EMAIL: ${{ env.CERTBOT_EMAIL }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          set -euo pipefail

          test -n "$AWS_ACCOUNT_ID" || {
            echo "AWS_ACCOUNT_ID variable is missing"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "AWS_ROLE_ARN secret is missing"
            exit 1
          }

          test -n "$EC2_HOST" || {
            echo "EC2_HOST variable is missing"
            exit 1
          }

          test -n "$EC2_SECURITY_GROUP_ID" || {
            echo "EC2_SECURITY_GROUP_ID variable is missing"
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY" || {
            echo "EC2_SSH_PRIVATE_KEY secret is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "EC2_SSH_USER variable is missing"
            exit 1
          }

          test -n "$ANSIBLE_VAULT_PASSWORD" || {
            echo "ANSIBLE_VAULT_PASSWORD secret is missing"
            exit 1
          }

          test -n "$RDS_ENDPOINT" || {
            echo "RDS_ENDPOINT repository variable is missing"
            exit 1
          }
          test -n "$CERTBOT_EMAIL" || {
            echo "CERTBOT_EMAIL repository variable is missing"
            exit 1
          }
          test -n "$DOMAIN_NAME" || {
            echo "DOMAIN_NAME repository variable is missing"
            exit 1
          }


          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$EC2_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and EC2 instance
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID" || {
            echo "OIDC role resolved to unexpected AWS account"
            exit 1
          }

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters \
              "Name=ip-address,Values=${EC2_HOST}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          [[ "$INSTANCE_ID" == i-* ]] || {
            echo "Could not identify the running EC2 instance"
            exit 1
          }

          echo "Verified EC2 instance: $INSTANCE_ID"

      - name: Temporarily allow this GitHub runner to SSH
        id: runner-ip
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')"

          [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]

          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=Temporary-GitHub-Actions-SSH}]"

      - name: Set up Python and Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==2.20.1"

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            -r ansible/requirements.yml

      - name: Create SSH inventory and Vault password file
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2_ssh_key"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault_pass"

          chmod 600 "$RUNNER_TEMP/ec2_ssh_key" "$RUNNER_TEMP/vault_pass"

          mkdir -p "$HOME/.ssh"

          # Trust on first use. Prefer a previously verified host fingerprint.
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          cat > "$RUNNER_TEMP/ssh_inventory.ini" <<INV
          [webservers]
          inventory-ec2 ansible_host=${EC2_HOST} ansible_user=${SSH_USER} ansible_ssh_private_key_file=${RUNNER_TEMP}/ec2_ssh_key

          [webservers:vars]
          ansible_python_interpreter=/usr/bin/python3
          ansible_become=true
          ansible_become_user=root
          INV

      - name: Test SSH connectivity
        run: |
          ansible webservers \
            -i "$RUNNER_TEMP/ssh_inventory.ini" \
            -m ping

      - name: Deploy immutable image using Ansible over SSH
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_FORCE_COLOR: "1"
          RDS_ENDPOINT: ${{ env.RDS_ENDPOINT }}
          CERTBOT_EMAIL: ${{ env.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail

          ansible-playbook site.yml \
            -i "$RUNNER_TEMP/ssh_inventory.ini" \
            --vault-password-file "$RUNNER_TEMP/vault_pass" \
            -e "ecr_image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -e "db_host=${RDS_ENDPOINT}" \
            -e "certbot_email=${CERTBOT_EMAIL}" \
            -e "aws_account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -e "domain_name=${{ vars.DOMAIN_NAME }}"

      - name: Remove temporary SSH ingress rule
        if: always() && steps.runner-ip.outputs.runner_ip != ''
        env:
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.runner_ip }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

      - name: Remove temporary deployment files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/vault_pass" \
            "$RUNNER_TEMP/ssh_inventory.ini" \
            "$RUNNER_TEMP/ec2_ssh_key"
